name: Build

on:
  push:
    branches: [ "**" ]

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ git gcovr

    - name: Configure and build tests with coverage
      working-directory: test
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="--coverage -O0" \
          ..
        cmake --build .

    - name: Run tests
      working-directory: test/build
      run: ctest --output-on-failure

    - name: Generate coverage report
      working-directory: test/build
      run: |
        gcovr --root ../.. --xml --output coverage.xml \
          --object-directory . \
          --exclude "_deps/" \
          --exclude "CMakeFiles/" \
          --exclude "googletest/" \
          --exclude "test/"
        gcovr --root ../.. --html --output coverage.html \
          --object-directory . \
          --exclude "_deps/" \
          --exclude "CMakeFiles/" \
          --exclude "googletest/" \
          --exclude "test/"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: test/build/coverage.*

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: test/build/coverage.xml
        flags: unittests
        name: unit-tests-coverage

  build-firmware:
    name: Build Firmware (${{ matrix.artifact }})
    needs: unit-tests
    # arduino/compile-sketches@v1 pins Python 3.12.4, which has no build for
    # ubuntu-26.04 (current ubuntu-latest). Use ubuntu-24.04 where it exists.
    runs-on: ubuntu-24.04
    # One firmware binary per supported board, selected via -DBOARD=<define>
    # (see simppeliTCU/hardware.h).
    strategy:
      fail-fast: false
      matrix:
        include:
          - board-define: LILYGO_T2CAN
            artifact: simppeliTCU-LilyGo-T2-Can
          - board-define: WAVESHARE_ESP32_S3_RS485_CAN
            artifact: simppeliTCU-Waveshare-esp32-rs485-can

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Sketch
      uses: arduino/compile-sketches@v1
      with:
        fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc
        sketch-paths: |
          simppeliTCU
        cli-compile-flags: |
          - --export-binaries
          - --build-property=compiler.cpp.extra_flags=-DBOARD=${{ matrix.board-define }}
        libraries: |
          - name: PubSubClient
          - name: autowp-mcp2515

    - name: Rename firmware binaries
      shell: bash
      run: |
        find simppeliTCU/build -maxdepth 1 -name 'simppeliTCU.ino.*' -type f | while read -r f; do
          base=$(basename "$f")
          mv "$f" "$(dirname "$f")/${{ matrix.artifact }}.${base#simppeliTCU.ino.}"
        done

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: simppeliTCU/build/
