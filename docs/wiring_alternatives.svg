<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 500" width="1360" height="500">
  <title>Alternative Car-Side Installation Options (Option B: CAN-Only Unpin + Power Tap, Option C: TCU Unplugged)</title>
  <rect x="0" y="0" width="1360" height="500" fill="#ffffff"/>
  <rect x="16" y="14" width="1328" height="52" rx="8" fill="#0f172a" stroke="#0f172a" stroke_width="1.5"/>
  <text x="34" y="38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="start">Simplified Car-Side Installation Alternatives (Without 16-Pin Sumitomo Adapter)</text>
  <text x="34" y="56" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#cbd5e1" text-anchor="start">Choose Option B if you want to keep the hands-free microphone without buying a 16-pin housing, or Option C if you do not need the microphone.</text>
  <rect x="16" y="78" width="652" height="406" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke_width="1.5"/>
  <text x="34" y="106" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="start">Option B: Unpin CAN (#6, #7) Only + Tap Power (#1, #28)</text>
  <text x="34" y="124" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#15803d" text-anchor="start">Hands-free microphone WORKS • 40-pin plug stays connected to TCU</text>
  <rect x="36" y="152" width="172" height="92" rx="6" fill="#1e293b" stroke="#0f172a" stroke_width="1.8"/>
  <text x="122" y="174" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">LilyGo T-2CAN</text>
  <text x="198" y="196" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#fef08a" text-anchor="end">CANHB</text>
  <text x="198" y="214" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#bbf7d0" text-anchor="end">CANLB</text>
  <text x="198" y="232" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#cbd5e1" text-anchor="end">SGNDB</text>
  <rect x="36" y="286" width="172" height="76" rx="6" fill="#ffffff" stroke="#475569" stroke_width="1.6"/>
  <text x="122" y="308" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">12V -&gt; 5V USB</text>
  <text x="198" y="330" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="end">- GND</text>
  <text x="198" y="350" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626" text-anchor="end">+ 12V</text>
  <polyline points="36,324 24,324 24,198 36,198" fill="none" stroke="#ca8a04" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="404" y="152" width="158" height="214" rx="6" fill="#1e293b" stroke="#0f172a" stroke_width="2.0"/>
  <text x="483" y="174" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">40-Pin TCU Plug</text>
  <text x="483" y="190" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#86efac" text-anchor="middle">(Plugged into TCU)</text>
  <rect x="416" y="202" width="134" height="25" rx="3" fill="#0f172a" stroke="#f87171" stroke_width="1.4" stroke-dasharray="3,2"/>
  <text x="483" y="219" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#fca5a5" text-anchor="middle">#6 CAN-H (EMPTY)</text>
  <rect x="416" y="233" width="134" height="25" rx="3" fill="#0f172a" stroke="#f87171" stroke_width="1.4" stroke-dasharray="3,2"/>
  <text x="483" y="250" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#fca5a5" text-anchor="middle">#7 CAN-L (EMPTY)</text>
  <rect x="416" y="286" width="134" height="26" rx="3" fill="#334155" stroke="#94a3b8" stroke_width="1.2"/>
  <text x="483" y="303" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">#28 GND (Stays in)</text>
  <rect x="416" y="326" width="134" height="26" rx="3" fill="#334155" stroke="#94a3b8" stroke_width="1.2"/>
  <text x="483" y="343" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#fecaca" text-anchor="middle">#1 +12V (Stays in)</text>
  <rect x="592" y="152" width="62" height="214" rx="6" fill="#e2e8f0" stroke="#475569" stroke_width="1.6"/>
  <text x="623" y="248" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Car</text>
  <text x="623" y="264" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Loom</text>
