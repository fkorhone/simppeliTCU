  <circle cx="948" cy="296" r="4.5" fill="#1e293b" stroke="none" stroke-width="1.5"/>
  <polyline points="1136,346 1049,346" fill="none" stroke="#dc2626" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="991,346 897,346" fill="none" stroke="#dc2626" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
