  <circle cx="1036" cy="346" r="2.5" fill="#c2410c" stroke="none" stroke-width="1.5"/>
  <text x="1020" y="329" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#9a3412" text-anchor="middle">2A Fuse</text>
  <rect x="712" y="398" width="614" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke_width="1.3"/>
  <text x="726" y="419" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a" text-anchor="start">When to use Option C:</text>
  <text x="726" y="437" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#334155" text-anchor="start">• Original TCU is removed or left unplugged (+ optional #26/#27 to LilyGo Port A for AV-CAN).</text>
  <text x="726" y="454" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#334155" text-anchor="start">• No power loopback needed, but the cabin hands-free phone microphone will not function.</text>
</svg>
