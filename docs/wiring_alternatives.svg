  <circle cx="332" cy="346" r="2.5" fill="#c2410c" stroke="none" stroke-width="1.5"/>
  <text x="316" y="329" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#9a3412" text-anchor="middle">2A Fuse</text>
  <text x="326" y="286" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#0369a1" text-anchor="middle">Tap #28 &amp; #1 (Posi-Tap / Wago)</text>
  <rect x="36" y="398" width="618" height="70" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke_width="1.3"/>
  <text x="50" y="418" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#92400e" text-anchor="start">Splice Tip:</text>
  <text x="118" y="418" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#78350f" text-anchor="start">Tap #1 (+12V) &amp; #28 (GND) on the harness behind the 40-pin plug (Posi-Tap / Wago / solder).</text>
  <text x="50" y="437" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#92400e" text-anchor="start">Do NOT use insulation-displacement clips ('rosvoliitin' / Scotchlocks) on CAN data wires;</text>
  <text x="50" y="454" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#78350f" text-anchor="start">for optional AV-CAN, also unpin #26 (SB, M CAN-H) &amp; #27 (LG, M CAN-L) to LilyGo Port A.</text>
  <rect x="692" y="78" width="652" height="406" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke_width="1.5"/>
  <text x="710" y="106" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="start">Option C: Original TCU Completely Unplugged (4 or 6 Wires)</text>
  <text x="710" y="124" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#b45309" text-anchor="start">Hands-free microphone DISABLED • Simplest wiring (no power loopback needed)</text>
  <rect x="712" y="152" width="185" height="92" rx="6" fill="#1e293b" stroke="#0f172a" stroke_width="1.8"/>
  <text x="804" y="174" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">LilyGo T-2CAN</text>
  <text x="886" y="196" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#fef08a" text-anchor="end">CANHB</text>
  <text x="886" y="214" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#bbf7d0" text-anchor="end">CANLB</text>
  <text x="886" y="232" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#cbd5e1" text-anchor="end">SGNDB</text>
  <rect x="712" y="286" width="185" height="76" rx="6" fill="#ffffff" stroke="#475569" stroke_width="1.6"/>
  <text x="804" y="308" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">12V -&gt; 5V USB</text>
  <text x="886" y="330" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="end">- GND</text>
  <text x="886" y="350" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626" text-anchor="end">+ 12V</text>
  <polyline points="712,324 700,324 700,198 712,198" fill="none" stroke="#ca8a04" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1136" y="152" width="190" height="214" rx="6" fill="#334155" stroke="#475569" stroke_width="2.0" stroke-dasharray="6,4"/>
  <text x="1231" y="175" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">40-Pin Harness Plug</text>
  <text x="1231" y="192" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#fcd34d" text-anchor="middle">(Left UNPLUGGED from TCU)</text>
  <text x="1150" y="220" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#bae6fd" text-anchor="start">Pin #6  (SB IT-CAN H)</text>
  <text x="1150" y="245" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#ddd6fe" text-anchor="start">Pin #7  (V IT-CAN L)</text>
  <text x="1150" y="300" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#f8fafc" text-anchor="start">Pin #28 (B GND)</text>
  <text x="1150" y="346" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#fecaca" text-anchor="start">Pin #1  (W +12V)</text>
