<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" width="980" height="450">
  <title>Alternative Controller Wiring: Waveshare ESP32-S3-RS485-CAN to 16-Pin Adapter</title>
  <rect x="0" y="0" width="980" height="450" fill="#ffffff"/>
  <rect x="16" y="14" width="948" height="52" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
  <text x="34" y="38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="start">Alternative Controller: Waveshare ESP32-S3-RS485-CAN (Device Side)</text>
  <text x="34" y="56" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#cbd5e1" text-anchor="start">Uses onboard 7–36V DC wide-input regulator (no separate 12V-&gt;5V USB socket needed). Car Side (16-pin Female) is identical to Option A.</text>
