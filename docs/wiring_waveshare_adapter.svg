  <text x="238.0" y="191" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#94a3b8" text-anchor="middle">Built-in DC 7–36V Power &amp; Single CAN (GPIO 15/16)</text>
